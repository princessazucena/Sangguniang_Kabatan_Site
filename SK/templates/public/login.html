{% extends "base.html" %}
{% block title %}Log in · Scholarship Portal{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow p-6 border border-slate-100">
    <h1 class="text-2xl font-bold mb-1">Welcome back</h1>
    <p class="text-sm text-slate-500 mb-5">Log in to continue your application.</p>

    <form method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            <input name="email" type="email" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input name="password" type="password" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-md">
            Log in
        </button>
    </form>

    <p class="text-sm text-slate-600 mt-4">
        Don't have an account?
        <a href="{{ url_for('public.signup') }}" class="text-indigo-600 hover:underline">Sign up</a>
    </p>
</div>
{% endblock %}
