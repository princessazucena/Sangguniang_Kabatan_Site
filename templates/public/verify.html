{% extends "public/_auth_layout.html" %}
{% block title %}Verify email · Sangguniang Kabataan ng Bukal Scholarship Portal{% endblock %}

{% block auth_content %}
<h1 class="text-xl font-bold mb-1 text-brand-700">Verify your email</h1>
<p class="text-sm text-slate-600 mb-4">
    We sent a 6-digit verification code to
    <span class="font-medium text-slate-800">{{ email }}</span>.
    Enter it below to activate your account.
</p>

<form method="post" class="space-y-3">
    <input type="hidden" name="email" value="{{ email }}" />
    <div>
        <label class="block text-sm font-medium mb-1">Verification code</label>
        <input name="token" required maxlength="6" inputmode="numeric"
               pattern="[0-9]{6}" placeholder="123456"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-center text-lg tracking-[0.5em] font-mono focus:outline-none focus:ring-2 focus:ring-brand-400" />
    </div>
    <button type="submit"
            class="w-full bg-brand-500 hover:bg-brand-600 text-white font-medium py-2 rounded-md text-sm">
        Verify and continue
    </button>
</form>

<form method="post" action="{{ url_for('public.resend_code') }}" class="mt-2">
    <input type="hidden" name="email" value="{{ email }}" />
    <button type="submit"
            class="w-full text-sm text-brand-600 hover:underline">
        Resend code
    </button>
</form>
{% endblock %}
