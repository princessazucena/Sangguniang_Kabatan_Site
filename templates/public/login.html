{% extends "public/_auth_layout.html" %}
{% block title %}Log in · Sangguniang Kabataan ng Bukal Scholarship Portal{% endblock %}

{% block auth_content %}
<h1 class="text-xl font-bold mb-1 text-brand-700">Welcome back</h1>
<p class="text-sm text-slate-500 mb-4">Log in to continue your application.</p>

<form method="post" class="space-y-3">
    {% if next %}
        <input type="hidden" name="next" value="{{ next }}" />
    {% endif %}
    <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input name="email" type="email" required
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />
    </div>
    <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <div class="password-field relative">
            <input name="password" type="password" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />
            <button type="button" data-password-toggle
                    class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-500 hover:text-slate-700"
                    aria-label="Show password" aria-pressed="false">
                <i class="fa-regular fa-eye"></i>
            </button>
        </div>
    </div>
    <button type="submit"
            class="w-full bg-brand-500 hover:bg-brand-600 text-white font-medium py-2 rounded-md text-sm">
        Log in
    </button>
</form>

<p class="text-sm text-slate-600 mt-3">
    Don't have an account?
    <a href="{{ url_for('public.signup') }}" class="text-brand-600 hover:underline">Sign up</a>
</p>
{% endblock %}
