{% extends "base.html" %}
{% block title %}Sign up · Scholarship Portal{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow p-6 border border-slate-100">
    <h1 class="text-2xl font-bold mb-1">Create your account</h1>
    <p class="text-sm text-slate-500 mb-5">Sign up as a student to apply for a scholarship.</p>

    <form method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1">Full name</label>
            <input name="full_name" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            <input name="email" type="email" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input name="password" type="password" minlength="6" required
                   class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            <p class="text-xs text-slate-500 mt-1">At least 6 characters.</p>
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-md">
            Sign up
        </button>
    </form>

    <p class="text-sm text-slate-600 mt-4">
        Already have an account?
        <a href="{{ url_for('public.login') }}" class="text-indigo-600 hover:underline">Log in</a>
    </p>
</div>
{% endblock %}
